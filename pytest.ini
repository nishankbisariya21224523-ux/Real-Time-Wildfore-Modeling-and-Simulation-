[pytest]
pythonpath = .
testpaths =
    services/api/tests
    services/data-pipeline/tests
    services/risk-engine/tests
    services/spread-engine/tests
    tests/integration
norecursedirs =
    .venv
    node_modules
    services/data_pipeline
    services/risk_engine
    services/spread_engine
    packages/shared_types
    packages/geo_utils
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
